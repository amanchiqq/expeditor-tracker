name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: tracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-with-more-than-32-characters
      DATABASE_URL: postgresql://tracker:test-only-password@localhost:5432/tracker_test
      TEST_DATABASE_URL: postgresql://tracker:test-only-password@localhost:5432/tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/migrate.py
      - run: python scripts/migrate.py
      - run: python -m pytest -q
      - run: node --test tests/frontend.test.cjs
